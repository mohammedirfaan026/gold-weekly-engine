services:
  - type: web
    name: gold-weekly-bias
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m web.app
    plan: free
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: DASHBOARD_PORT
        value: 10000
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: DASHBOARD_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_DEBUG
        value: "0"
