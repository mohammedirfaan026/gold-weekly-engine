name: Weekly Live Bias Inference

on:
  schedule:
    # Run every Friday at 21:30 UTC (immediately following NY close)
    - cron: '30 21 * * 5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Live Prediction
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # If API keys are present, perform live ingestion; otherwise run model inference on current matrix
          if [ -n "$FRED_API_KEY" ]; then
            python run_weekly_live.py
          else
            python run_weekly_live.py --skip-ingest
          fi

      - name: Commit and Push Updated Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/ research/reports/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(live): automated weekly bias forecast update [skip ci]"
            git push
          fi
