<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Weekly — Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='desk.css') }}" />
</head>
<body class="login-body">
  <div class="grain" aria-hidden="true"></div>
  <section class="login-hero">
    <p class="eyebrow">Private desk</p>
    <h1>GOLD<span>WEEKLY</span></h1>
    <p class="lede">Read-only macro brief. You still take the trade.</p>
    <form method="post" class="login-form">
      <label for="password">Access key</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Enter desk</button>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </form>
  </section>
</body>
</html>
